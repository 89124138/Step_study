<script>const DATA=[{"id":"h1","subject":"歷史","n":1,"q":"北京每日新聞刊登美國學者古德諾的文章：「中國數千年以來，習於君主專制體制，各地學校短缺，大多數之人民智識不甚高尚，人民更缺乏參與政治之能力，四年以前，由專制一變而為共和，此番變動太快，難望有良好結果……中國將來必因總統繼承問題『釀成禍亂』......如一時不立即撲滅禍亂，可能導致敗壞中國之獨立……中國如用君主制，較共和制為宜，此殆無可疑者也。」請問：這篇文章發表後有利於下列何種政治情勢的出現？","opts":["武昌起義成功","爆發二次革命","圖謀洪憲帝制","造成南北分裂"],"ans":2,"tip":"背景知識：抓到古德諾主張『君主制較共和制適合中國』，就要聯想到袁世凱稱帝。\n\n判斷方法：看到支持君主制的外國顧問言論，先連到袁世凱的洪憲帝制。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"看到支持君主制的外國顧問言論，先連到袁世凱的洪憲帝制，因此選C。","img":null},{"id":"h2","subject":"歷史","n":2,"q":"「○○○利用黎元洪與段祺瑞的矛盾，率五千『辮子兵』， 假借『調停』的名義入京。在清宮召開『御前會議』， 把一個十二歲的孩童拱上帝位，改稱此年為『宣統九年』，通電全國改掛龍旗並自任議政大臣……但為期僅十二天便失敗。」請問：○○○應該是下列何人？","opts":["溥儀","張勳","宋教仁","張作霖"],"ans":1,"tip":"背景知識：『辮子兵、宣統九年、復辟十二天』是張勳復辟的關鍵字。\n\n判斷方法：用人物標誌記憶：張勳＝辮子軍＝短暫復辟。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"用人物標誌記憶：張勳＝辮子軍＝短暫復辟，選B。","img":null},{"id":"h3","subject":"歷史","n":3,"q":"請問：附圖對話所討論的歷史事件意外促成了下列哪一個紀念日的產生？","opts":["國慶日（10/10）","開國紀念日（1/1）","國恥紀念日（5/9）","和平紀念日 （2/28）"],"ans":0,"tip":"背景知識：先辨認附圖事件，再把事件日期和現今紀念日連結；答案以講義標記為準。\n\n判斷方法：紀念日題先找事件發生日，再比對選項；依題圖所示事件。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"紀念日題先找事件發生日，再比對選項；依題圖所示事件選A。","img":"data:image/webp;base64,UklGRqBoAABXRUJQVlA4IJRoAACwTwGdASpMArwBPj0ci0QiIaETOg3YIAPEtLd9+8oH8rqAB1oPNdwD+gDTNBRIFzrWeVeWy746/oX41+AP9V/uf7A/270l/EPk/6Z/cv8J/dv7P/4v838cv8n+V3oU9P/jP9l6Ffxv60fVP7F+yv9u/bb42/t/9l/bT+7/s/7V/Cj+B/wP9+/yv90/dH7BfxT+M/1j+0/sf/Z/23+tT6r/J90Xr/+n/wv9+/ar9//oF9PvmP95/t/+d/3H9v/bn2jv4z+0ftf++3yh+cf2j/Cfl9/e///+AP8Z/mH95/v/7if2////7H8A/yv/O8bXzb/vf6j4Av5N/Vv9z/f/8h+zX0ofxv/N/x3+k/7f+c/////+O/5d/iv+N/k/9X/7f9L////F+hX8q/qH+o/vf+W/7/+O////28sno9fvT//zZSdOo8g6fO8boHkHT53jdA8g6fO2WXDIV3eN0DyDp87xugeQdPneN0DyDp87eXJ06jyDp87xugeQdPneN0DyDp87w8I+d1yDp87xugeQdPneN0DyDp87xse+d1yDp87xugWwNJS6PAsUzMVEzhugeQZvOrujBugeQdPneN0DyDp87xugeQdGbWG6B5B0+d43QPIOnzvG6B5B0+d4eEfO65B0+d43QPIOnzvG6B5B0+d42PfO65B0+d43QPIOnzvG6B5B0+d43NhLTrRbcl+TUi7OfnxAck8iovEWG2COY/jHm/Yr0763xCHpdPihCEZ0hF1lW8Mgiu3EK2nnAKepEFEW7tvnX3u7AcioSrDbBH 確認各選項是否屬於同一時期。","skill":"外交年代配對：1972尼克森訪中、會見毛澤東，選C。","img":null},{"id":"h28","subject":"歷史","n":28,"q":"「冷戰」是相對應「熱戰」而來，意旨兩陣營互相對峙， 但又避免爆發全面衝突的狀態。第二次世界大戰之後， 以美國為首的「自由」陣營，與以蘇聯為首的「共產」 陣營，相互對抗，由於雙方都恐懼衝突演變為「核戰爭」，因而開啟了「冷戰」時代，但美蘇不直接對抗， 仍然透過「代理人」打了不少「熱戰」，例如圖中哪些地區便淪為受害區域？","opts":["甲乙","甲丙","乙丁","丙戊"],"ans":1,"tip":"背景知識：冷戰代理戰要找韓戰、越戰等美蘇陣營間接交鋒的地區。\n\n判斷方法：先圈出韓國與越南等代理戰地點，依圖代號。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"先圈出韓國與越南等代理戰地點，依圖代號選B。","img":"data:image/webp;base64,UklGRmw4AABXRUJQVlA4IGA4AADQ4ACdASq+AcABPj0cjEQiIaESSU2sIAPEtLdwuI8S7CNb/x+ACljpS/+RoPZ+oH9H/ID3w94v4n+2fs94lfoX7f/cP2e/u/xf/U3+L4gPKP3v/b/5v1K/iv1x++/2v/G/8b+9e0/+Z8I/xz90/zn2+fIF+P/zD++/3/9tv8d8If0H+27YPZf81/qfUF9SvoH+U/wv+Y/5v+K9D3+k/s3qf+e/3b/H/cj9gP8q/p/+d/un71f4b////T8F/pv/L8Sn8h/t/+v/sPgA/lf9W/1n96/fD/AfSd++f8n/H/6r9ufah+S/33/gf4b/Wfs59gv8h/on+s/un+T/9/+d////6+5T/x+6v9r/Yv/Wz/5k3Hy+hOvM1ZXxyntCfkw8oEfaE/Jh5CFDgO2fGwjFQwbF5Oz6aSjQxq6nbqXZisg1yBBfD5Agvh05yjtQ99izXl34u/D+1x9DS618QzQuPuk37EAREf/RuYXEJO/Mrxl1/WjIAfX2+GYu5EjAULv5MBOcXw+QIL4CQRP8GjDBcSjpIE4+0YZgAnMqTINTEMaNWSpURDfTGH1AaFxgGTjDfHVTZIdGxzC98wUvZW90nV/AXzP7XVWHxnspDHxdF/mP287UNqr4mx84cXqyErVz6xdM3YAReSQJPbuPVda5Qe3/JfM9Fkpiyxf1cv6kw8ecf6+T81SQaK/nclVk5hDWQOQyghZqHfzgKPbxTo8NE96IuNKyVCGoMyo8umBetdV54XoBdta5/nwsEtrOOAOi7CotBoaAFKalxXrcrGLDHt92e5HakR3UEv2rU6FFYfCDtVu7C/e5kZa7XQoem5sRz850LtnsuVq420o4G/GFhWmINd4EQ2aZ11uJ5ryO4t/W22Gm2Ayfa07+mEwKBYuw+bhlzND/sPAPWxUai2DrvcA1VvPOfIo8KSlMz2dUm0x8zLFKdEHNBaAdYfK2BGvfc4+rLmNbiI28OEc9R8F0O+JOE4fMULGwdnamOCWH+SZryPj6yu5K3I2Xbc2geQ4WdKiBlChC85a+nGwF0BfxtS+ZYzT+brr8mzn+lh7V4cxniaxFmNXUTKuf7EPewPj2PumZunQ2ve6X2zXrzYCBRYyDc6tFbe8BeRjpE+YuTVpBjvJLQiGurF3Yhp/TaQzQuPumZ6VBc7194/g/s+WyF9MRRUvfPW+ed1smWUAJdhuRBdm2kUu7sDDZgkICdQZ8ABSLOdleBOcXw+QIL4AXtpuj+R9IbBEqSVkO7+RqKdS2DnHm2QgU3cIr/Pl30iHTyGDsf2lPD0aRuf13+aifhUYQ1JHbizW/NeR8gQXw+Ah3iFOtStBIqnf/oVbFY1uodwLf8434hE/JDJQU8FjHR+z2OqV9HhzlCTNP3SLbVe8gCzXkfIEF8O1/Von0HHGEqlE8HL74Lbbt9KyC21zXCqpwWPUz8NWge8XV+dJYNQ9FRCSNT7j8amSvOktQzQuPuUvO+itqWZgrCAxNG/uQtQo2cAyZ :0,"tip":"背景知識：東約偏軍事反共且由西方主導；東協由東南亞國家主導並重合作。\n\n判斷方法：用主導者與功能比較兩組織，只有A正確。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"用主導者與功能比較兩組織，只有A正確。","img":null},{"id":"h30","subject":"歷史","n":30,"q":"民國62 年，政府推動「十大建設」，包括高速公路、 港口、機場與重工業等重大公共建設，帶動臺灣經濟快速成長，也為日後產業升級奠定基礎。相較之下，當時中國大陸正處於不同的發展階段。請問：依據當時兩岸發展情況判斷，中國大陸最可能處於下列何種狀況？","opts":["農工產值大幅提升，發展出口導向策略","加入世界貿易組織，積極與國際接軌","歷經文化大革命，社會經濟飽受衝擊","推行初步土地改革，施行耕者有其田"],"ans":2,"tip":"背景知識：臺灣十大建設始於1970年代，同期中國大陸剛歷經文化大革命衝擊。\n\n判斷方法：民國62年是1973年；中國大陸仍受文革衝擊。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"民國62年是1973年；中國大陸仍受文革衝擊，選C。","img":null},{"id":"h31","subject":"歷史","n":31,"q":"20 世紀中期以來，中蘇兩國關係經歷由合作到對立， 再到後期逐步緩和與調整的變化歷程，期間受到意識形態、國家利益與邊界安全等多重因素影響。下列關於中蘇關係演變的敘述，何者正確？","opts":["中蘇關係破裂主要源於改革開放後，雙方在市場經濟制度上的競爭","兩國關係惡化過程中，曾因邊界劃分爭議與軍事對峙而激化對立","兩國關係生變初始於文革期間，蘇聯曾大力干預中國內政事務","中蘇關係惡化發生在冷戰後期，因蘇聯解體後權力真空而引發"],"ans":1,"tip":"背景知識：中蘇交惡不只意識形態，也曾因邊界爭議爆發軍事對峙。\n\n判斷方法：中蘇交惡的實例是珍寶島等邊界衝突。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"中蘇交惡的實例是珍寶島等邊界衝突，選B。","img":null},{"id":"h32","subject":"歷史","n":32,"q":"「蝴蝶效應」指的是在一個系統中，初始條件的微小變化，可能引發長期且巨大的連鎖反應。中國政治史上，某位領導人的決策與言行，曾掀起全國性的政治運動，甚至影響國際局勢，並造成被稱為「十年浩劫」 的重大衝擊。若追尋此一政治運動最初推動的原因， 下列何者最為合理？","opts":["防範反革命勢力與維護政權安全","強化群眾教育與推動思想改造","推動社會革新與改革傳統文化","鞏固政治權力與打擊政敵"],"ans":3,"tip":"背景知識：『十年浩劫』是文化大革命；最初核心動機是毛澤東鞏固權力、打擊政敵。\n\n判斷方法：政治運動動機題要區分表面口號與權力目的。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"政治運動動機題要區分表面口號與權力目的，選D。","img":null},{"id":"h33","subject":"歷史","n":33,"q":"承上題，該政治運動歷時約十年，對中國社會、教育、 政治與經濟發展造成深遠影響。下列何者最能說明此一運動帶來的結果與影響？","opts":["批鬥盛行，價值觀出現扭曲","儒家思想首次遭到強烈批判","西歐地區出現新興共黨勢力","外行領導內行，造成大飢荒"],"ans":0,"tip":"背景知識：文革最直接的社會影響是批鬥盛行、秩序與價值觀扭曲。\n\n判斷方法：結果題找最具代表且直接的社會現象：批鬥與價值扭曲。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"結果題找最具代表且直接的社會現象：批鬥與價值扭曲，選A。","img":null},{"id":"h34","subject":"歷史","n":34,"q":"西元2019 年2 月，美國與菲律賓就兩國於1951 年8 月簽署《美菲共同防禦條約》進行修改協商。此前，美國也曾在1954 年與中華民國簽訂《中美共同防禦條約》，1960 年與日本簽署《美日安保條約》。請問：由當時國際局勢分析，促使條約簽訂的關鍵目的為何？","opts":["防止第二次世界大戰後軸心國再次發動侵略","建立跨國軍事同盟以對抗中東恐怖主義","維護亞洲地區自由貿易與經濟合作","防堵共產勢力向亞洲地區持續擴張"],"ans":3,"tip":"背景知識：1950至60年代亞洲共同防禦條約的核心是冷戰下防堵共產勢力。\n\n判斷方法：把條約放進冷戰圍堵體系。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"把條約放進冷戰圍堵體系，答案D。","img":null},{"id":"h35","subject":"歷史","n":35,"q":"一場社會或政治運動若具有鮮明且響亮的標語或口號， 往往能有效凝聚群眾力量、鼓舞社會氛圍，並反映該時期政策推動或運動發展的核心理念。下列關於中國近現代政治運動與其代表性口號的配對，何者有「誤」？","opts":["建國初期土地改革─「打土豪，分田地」","大躍進時期─「吃飯不花錢，努力搞生產」","文化大革命 ─「破四舊，立四新」","改革開放初推動時─「三年超英，五年趕美」"],"ans":3,"tip":"背景知識：把口號放回時代：『超英趕美』屬大躍進，不是改革開放。\n\n判斷方法：口號配對可用年代驗證；D把大躍進口號放錯到改革開放。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"口號配對可用年代驗證；D把大躍進口號放錯到改革開放，故選D。","img":null},{"id":"h36","subject":"歷史","n":36,"q":"民運所指為人民或社會團體為了爭取政治權利、民主制度、自由與人權而進行的社會或政治行動。西元 1980~1990 年代，許多國家發生民主運動，以致統治者不得不回應民眾訴求，但有些回覆未必是友善的。因此，有的國家順利政治轉型，有的國家則流下鮮血。例如：西元1990 年，臺灣的野百合學運就以和平落幕收場，也實現了學生爭取的哪一項訴求？","opts":["推動一國兩制","廢除黨禁報禁","終止動員戡亂","地方自治選舉"],"ans":2,"tip":"背景知識：野百合學運的重要成果之一是推動終止動員戡亂、回歸憲政。\n\n判斷方法：記住野百合四大訴求與後續：終止動員戡亂。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"記住野百合四大訴求與後續：終止動員戡亂，選C。","img":null},{"id":"h37","subject":"歷史","n":37,"q":"近年來，政府積極推動「南向政策」，希望透過與東南亞、南亞、紐西蘭及澳洲等國家建立更緊密的合作關係，拓展多元的國際交流管道。此政策除了重視經濟與貿易合作外，也強調教育、文化、人才交流、醫療及觀光等面向，以降低過度依賴單一市場可能帶來的風險。根據上述內容，下列何者最符合政府推動南向政策的主要目的？","opts":["強化與亞洲及其他南向國家的合作，提升國際競爭力","停止與其他主要經濟體往來，建立封閉型經濟制度","減少與鄰近國家的文化交流，以維持本土文化特色","將所有對外投資集中於少數國家，以提高管理效率"],"ans":0,"tip":"背景知識：南向政策是分散市場風險、深化南向國家多面向合作。\n\n判斷方法：把政策目的濃縮成『多元合作＋分散風險』。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"把政策目的濃縮成『多元合作＋分散風險』，選A。","img":null},{"id":"h38","subject":"歷史","n":38,"q":"資料一：「當時要煉鋼，因此人人將鍋、鏟等鐵器全丟進土法煉鋼爐燒煉。因為上級要求修築一條運送鋼鐵的道路，只好將鄭和墓塚的石材挪來鋪設路基，但最後始終沒有煉出足夠鋼鐵，連卡車都沒有開來運送。」 資料二：「東方語文系的批鬥開始了。原本我只是配角， 今天卻被升格成主角。一陣急促的敲門聲後，兩名紅衛兵闖入，他們手臂上的紅袖章格外醒目，將我押往外文大樓。我在系上工作二十多年，眼前這些人曾是我的學生與同事；過去我坐在會議室裡主持事務，如今卻只能站著，並被冠上「反革命分子」的罪名。」 資料三：「當時地方幹部寧可讓你餓死家中，也不准私自逃荒。搭乘公共汽車或火車都需要人民公社開立證明。有戶人家的三兄弟，為了逃離飢餓，其中一人偷偷趁管理員離開時，潛入公社辦公室蓋印後逃走。」 資料四：某位工廠工人回憶：「以前工資低、商品少， 大家生活都差不多。後來政府允許做生意，也有外資工廠進駐，街上開始出現高樓與商店，很多人都說『只要肯努力，就有機會先富起來』。」 請根據以上資料內容判斷，其發生在中國的先後順序為何？","opts":["資料一 → 資料二 → 資料三 → 資料四","資料一 → 資料三 → 資料二 → 資料四","資料三 → 資料一 → 資料二 → 資料四","資料三 → 資料四 → 資料一 → 資料二"],"ans":1,"tip":"背景知識：先辨識四資料：大煉鋼→大饑荒→文革批鬥→改革開放。\n\n判斷方法：先給每份資料貼年代標籤再排序，得到一→三→二→四。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"先給每份資料貼年代標籤再排序，得到一→三→二→四，選B。","img":null},{"id":"h39","subject":"歷史","n":39,"q":"西元1949 年中華人民共和國成立後，面對長期戰亂所造成的社會動盪與經濟困境，中國共產黨為了穩固新生政權、恢復社會秩序並建立社會主義國家體制，積極推動多項改造措施。這些政策不僅影響人民的生活方式，也深刻改變中國的社會結構與政治發展方向。 下列哪些是中華人民共和國建國初期推行的重要措施與政策？(甲)沒收地主土地並重新分配給農民 (乙) 將重要工商企業逐步收歸國有 (丙)鼓勵知識分子暢所欲言，加入共黨 (丁)發動「抗美援朝」，強調「保家衛國」","opts":["甲乙丙丁","甲乙丙","甲乙丁","乙丙丁。 二、整合題："],"ans":2,"tip":"背景知識：建國初期有土地改革、工商國有化與抗美援朝；『暢所欲言加入共黨』不是主要政策。\n\n判斷方法：排除丙後剩甲乙丁。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"排除丙後剩甲乙丁，選C。","img":null},{"id":"h40","subject":"歷史","n":40,"q":"【題組資料】清帝退位詔書：朕欽奉隆裕皇太后懿旨：前因民軍起事，各省響應，九夏沸騰，生靈塗炭。特命袁世凱遣員與民軍代表討論大局，議開國會、公決政體。兩月以來，尚無確當辦法……徒以國體一日不決，故民生一日不安。今全國人民心理多傾向共和，南中各省既倡義於前，北方諸將亦主張於後，人心所嚮，天命可知。予亦何忍因一姓之尊榮，拂兆民之好惡……即由袁世凱以全權組織臨時共和政府，與民軍協商統一辦法……。宣統三年十二月二十五日。\n\n清帝退位詔書中提到「前因民軍起事，各省回應，九夏沸騰，生靈塗炭」，這是因為革命黨在附圖何處起義成功後，各地紛紛響應，導致滿清王朝的統治權搖搖欲墜？","opts":["甲","乙","丙","丁"],"ans":2,"tip":"背景知識：辛亥革命的起點是武昌起義，先在圖上定位武漢。\n\n判斷方法：武昌位於長江中游湖北，對照圖。\n\n作答提醒：先把人物、年代、制度或事件關鍵字圈出來，再確認各選項是否屬於同一時期。","skill":"武昌位於長江中游湖北，對照圖選C。","img":"data:image/webp;base64,UklGRh4bAABXRUJQVlA4IBIbAADwiACdASoEAi8BPj0cjESiIaEQ+D2sIAPEtLd+PkzkdahmfqN/RfxZ7+/7V+Snoj+I/Mf1v8mf3j98TIP5z/Uf6b0I/iv1o+2/2j9sv7j+63wt/fv694l/j/6n/fPyp+AX8P/kf9u/q/7F/279svWS7brY/MF9WfnH+O/v/7m/4L0N/7L0g+w/+09wD+Z/1f/Zfmr+//Q0epewF/V/716pP85/4/9V/qf2z9xn5f/nv+d/kvyw+wf+Z/1j/Y/4P95P8V////mNkfLs7TZSnbq+HoHdAiyeHMLBphv/bYhr40cHMc5TxVdNusLCSYUuGC0IwAiZ6BFkP2afFh4Z3lpX/1pzBrdzP8lxZxdxDXo/lK3EmLDZsS6g9a7boBLVl5p/sVBMSMPPUURXJPcxG9lkE7cZ0i5JpAu4hr0fylbhSQKRp3/zvNX/XCpT4zb7wz5jAyY6Wpp1JQvZxVU5u4yDm88ljvBrc03lRKqzPnGDs24gfuncQ18Tmqtl8l/GyywVL5fUhbcvMakc379v2t9bhSrzVexj20mayqXUhl/67FRcHVOp/kHFHkc9WzNfEOsJA26gbpW4lsMuTQcY9ajLi9CmlZ34m10ymf4HPxE4NiRpFXdSeD2VPkhcji2gbXTqSympRLqRDVHfqwXGEZcyhR5HPUTISNNRCd4qBeD3BE9ewp3CG6hD+4Npbrn/D7U+JBDE0zQV1ntsQ16PzeXLRwBmcda8Kz/CVEKIfZowWoIe5 洲礦藏豐富，與下列何者關係最密切？","opts":["河川堆積作用旺盛","氣候複雜多變","板塊強烈擠壓","為古老陸塊"],"ans":3,"tip":"背景知識：非洲古老陸塊長期地質作用，形成豐富礦藏。\n\n判斷方法：非洲大陸古老穩定，礦產與古老陸塊關係最大。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"非洲大陸古老穩定，礦產與古老陸塊關係最大，選D。","img":null},{"id":"g20","subject":"地理","n":20,"q":"漠南非洲的經濟活動較為落後，以農礦產品輸出為主要經濟來源，此發展主要受到下列何項因素的影響？","opts":["開發較晚","農礦產品品質優","殖民背景","人口密度低"],"ans":2,"tip":"背景知識：漠南非洲依賴農礦出口，主要與殖民經濟結構有關。\n\n判斷方法：把『原料輸出型經濟』連到殖民背景。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"把『原料輸出型經濟』連到殖民背景，選C。","img":null},{"id":"g21","subject":"地理","n":21,"q":"漠南非洲有種游耕的維生方式是一種相當原始的農業，農民藉由焚燒森林以取得土地，林木的灰燼成為農地的天然肥料，因此又稱為「火耕」。請問上述維生方式主要分布在圖中的哪個區域？","opts":["甲","乙","丙","丁"],"ans":0,"tip":"背景知識：焚林火耕多在高溫多雨、森林茂密的熱帶地區。\n\n判斷方法：游耕需森林供焚燒，依圖選熱帶雨林區甲。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"游耕需森林供焚燒，依圖選熱帶雨林區甲，選A。","img":"data:image/webp;base64,UklGRoQUAABXRUJQVlA4IHgUAABQWwCdASr0ANAAPj0ai0OiIaEVGdYAIAPEtLd8Lz2gdOSjn177aP7N9tHkU+f/un5Reu/Xffz/ob/Jfsr+E/tn7tevf+p8O/hX/jeoL+Sfz7/J/mf6D/8N3JOk/5D/C+oR61/N/8h/hP3L/xnoG/4P9I9U/q7/yfcA/kX9K/3H5pc1d5Z7AH5z/3f6tftl9KH8R/yf8D/lf3D9sv5//d/+1/i/8x8hH84/qf/L/wv+c99j2i+jx+43//O9Ych98ZhNBUKfWSD6PAqjNziiGL5kSpCSRndSxcsViVoipLDsGwILBdkPwqHylv9efa281JQqkXDBYO1QYlQ19clyak1Y4/uiWUgBUtqQilF5CW4hOmW+UIGfEbe8CA1O2fTKPcxUL/xUq9t2CTXkz22erBtlxaAfXNpDDMDmJtfNNWpsfEugqTkhy9DgO4D9G1kvwLbeLiLhXCRv8wxxqG7nt6XWBJaQ2nrFyOMmH/LMl4BxpPnbA1m/q0rwjzYbrdX1DElWRgKq6YJJT3JiK41/F57zn1MYYgcz+Vl2WhlkIfiwAxckqSfdwUJlnN3R1Oc5zjJxtVHBCWSvA31o/dj4PrlsKtT3mzAu04T01RDUDdxL4Ipu39GF99+UMvOuGw8+Hc3O3Me0wo8SzX1zet4J13xo7pAgiE10sr86lWwHV9CqiqL1XOplwjeNy5pg/5XysYfLCvMTwkWFWkstIcFlbHpvFqjTw6DDnkMe7yC5m0rbqdwAZfRmaurgoZzKy6C9IrASwiMgJExqoDkpj/fZGu5dgafvSQnZWVLwVdcZJnJjhEzMPMiLpald/+6+m4W4voqItSqOYgibVwOSKIDGePIygxuxMfKySZeep8b3kyj9UVB5pTqkMLFb+rW/A6n/ScEhFd0hFR2l7qMBhvVGmluzExvLD1wUkFvufka+j1XZlekRgUFsVzEVMJWlYrlZTL3eSGzIdMeJfFlF9uQIHr4Irk8AAP7/hI7ftGTsuyrSHSTKdPM717SCLxhbKKBt3dPT8S/z/YtOK60THefROr1rS5boqefoYCgU64bnnWKJk3r/xr1a7bQXIhGvRgs1XPvcLgrEIJ/n2/tvSlct9gSNv11tgmAJDptfCMJZ ，政府仍未正視兩大族群的對立，致使胡圖族對圖西族進行種族大屠殺，1994 年在短短100 天內，約80 萬人死於殺戮。根據上文，造成非洲內戰頻繁的主要原因為何？","opts":["爭奪礦產資源","宗教信仰不同","殖民勢力的介入","人口增加，糧食不足"],"ans":2,"tip":"背景知識：盧安達材料直接指出殖民者刻意強化族群對立。\n\n判斷方法：材料已指出比利時殖民統治安排。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"材料已指出比利時殖民統治安排，選C。","img":null},{"id":"g23","subject":"地理","n":23,"q":"「南部非洲的布希曼族在過去長達四萬年的歷史中，透過獵捕跳兔和劍羚，採集馬拉瑪豆和曼傑提果，每週只需勞動15 個小時就能攝取到足夠的營養。在全世界最乾燥、最貧瘠、最不宜人居的沙漠中，布希曼人透過獨特的生活模式與思維，藉由滿足極少的物質需求，過上優渥的生活。」（摘自《原始富足》書籍簡介），文中所提到的沙漠最可能哪一個沙漠？","opts":["撒哈拉沙漠","喀拉哈里沙漠","塔爾沙漠","塔克拉瑪干沙漠"],"ans":1,"tip":"背景知識：布希曼族分布南部非洲，對應喀拉哈里沙漠。\n\n判斷方法：用族群分布定位：布希曼—南部非洲—喀拉哈里。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"用族群分布定位：布希曼—南部非洲—喀拉哈里，選B。","img":null},{"id":"g24","subject":"地理","n":24,"q":"一般常見的國界多以自然地形畫分，如山脈、河川等，但漠南非洲有許多國家的國界卻是以經緯線畫分，如右圖。請問這種以經緯線畫分國界的方法，主要是受到什麼因素的影響？","opts":["經濟發展程度","宗教信仰不同","聚落分布方式","列強勢力入侵"],"ans":3,"tip":"背景知識：筆直經緯線國界多是列強殖民瓜分的結果。\n\n判斷方法：筆直國界不是自然形成，而是列強劃界。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"筆直國界不是自然形成，而是列強劃界，選D。","img":"data:image/webp;base64,UklGRnQqAABXRUJQVlA4IGgqAACQdwCdASr4AOYAPj0aikOiIaEV7ozsIAPEtLdwulCN+dj4Q/s3Zd/Y/yp8y/yD5t/M/239tf7p7cuCvrl/nfQP+XffX8r/f/3Z/w/u5/v/y18wfkF/o+oF+Tfz//Ifl3/eP3d+Yr6jsINj/1H/V9QL2A+kf6T+8/uH/jvSO/2vQH8//tn/W9wD+Sf0L/bf4D96f8b8B/1n9iPIN+a/27/xf6f4AP5j/VP+l/if9R+6H0lfxP/p/1H5e+xT88/v//o/0PwB/zb+zf9H/Ifvb/n////6fuT/93ta/Yj/9e6p+y//8OF/UkzTcGWt9+jC05mYt46o/ZvzZ03zVzBJzD7P1u+rJ9rbxwRaOww0+EP/3cHNSN+pT0JDYyjGueCYg0LEFGvhKbzTYsf1tDsk5Ydw4BO8WV2azFgHI/NbPyEfNteJULcWFNHK7pHb5VD/scNqFr0UsrCyraFA50L2lE3fmumZW8dUK80Z4QIZnG47w4Z8k4H7ZrxjG0PzFX3w5bpYoKfi25UmXt4UyhkJMq7Y9AFIN/C6IH7WQ0RBYvehv2WYO2UuGequ2Cuvkh27RZWGJhS5QsQTrrqQKBdh+5CBT4uu9lbfI57Hk8vLQQGPx52ffRqcke8rxxVaNLeVTNG0FE4hjnU3mSrU3i5rlAwBQ7mPjmrENcTf/HT221oTLPyujlqF+FqsdloWjk8xtbUW2UG49L17K1as+ff9itjgAHGv8donyQbB6ieO9tobljNFIB5DcPwXWCNY+TpQOSxK5RS9tp/0yNwM2WPBNpoT7mfTrTg9vDs94m/vNOA6ZAMkA3dBVxj05mV65YdM6uveksgC01qyNMnk+iLtGdEf0zh6qQL8cCM2Z54yJOsIOOVXwBt5yzXpzMxanPeajMYzd5fm2UcgxQn44Uf2VR27IrMHWPpgfSf73NEcR+7 建設極佳 (丁)薪資所得較低","opts":["甲乙丙","甲乙丁","甲丙丁","乙丙丁"],"ans":1,"tip":"背景知識：外資看重人口、市場與低薪；非洲基礎建設普遍不是優勢。\n\n判斷方法：甲乙丁是投資優勢，丙錯誤。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"甲乙丁是投資優勢，丙錯誤，因此選B。","img":null},{"id":"g31","subject":"地理","n":31,"q":"承上題，文中提到非洲自由貿易區是全球「最大」的自由貿易區，最可能指的是哪方面？","opts":["GDP 總值最高","區內人口總數最多","區內國家數最多","出口總額最高"],"ans":2,"tip":"背景知識：『最大自由貿易區』在此指涵蓋國家數最多。\n\n判斷方法：比較可能定義：文中強調54國，故指國家數。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"比較可能定義：文中強調54國，故指國家數，選C。","img":null},{"id":"g32","subject":"地理","n":32,"q":"【題組選項】（甲）泰國、（乙）汶萊、（丙）越南、（丁）緬甸、（戊）柬埔寨、（己）菲律賓、（庚）馬來西亞、（辛）印尼。\n\n東南亞文化圈中，由於位置的關係，受中國文化影響最深， 融合了儒家思想、佛教，並有崇尚長輩、祖先及重視教育的特質。","opts":["甲","丙","丁","戊"],"ans":1,"tip":"背景知識：受中國文化最深的東南亞國家是越南。\n\n判斷方法：題組代號中丙為越南。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"題組代號中丙為越南，選B。","img":null},{"id":"g33","subject":"地理","n":33,"q":"【題組選項】（甲）泰國、（乙）汶萊、（丙）越南、（丁）緬甸、（戊）柬埔寨、（己）菲律賓、（庚）馬來西亞、（辛）印尼。\n\n受西方殖民的影響，居民多信仰天主教，且以英文為主要語言。近年更是台灣學生出國遊學，學習英文的熱門地點。","opts":["乙","庚","己","辛"],"ans":2,"tip":"背景知識：天主教與英語並重、遊學熱門的是菲律賓。\n\n判斷方法：己為菲律賓，對應選項C。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"己為菲律賓，對應選項C。","img":null},{"id":"g34","subject":"地理","n":34,"q":"【題組選項】（甲）泰國、（乙）汶萊、（丙）越南、（丁）緬甸、（戊）柬埔寨、（己）菲律賓、（庚）馬來西亞、（辛）印尼。\n\n經濟仰賴出口農礦資源，盛產石油、天然氣、咖啡及油棕等。居民多為穆斯林，但其峇厘島受印度文化影響，多奉行印度教。","opts":["丁","戊","庚","辛"],"ans":3,"tip":"背景知識：穆斯林為主、峇里島信印度教、盛產油氣與油棕的是印尼。\n\n判斷方法：辛為印尼，對應選項D。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"辛為印尼，對應選項D。","img":null},{"id":"g35","subject":"地理","n":35,"q":"【題組資料】附圖為臺灣近年在東南亞主要國家的投資金額，請根據附圖回答。\n\n台灣在東南亞的投資項目下列哪些類別可能最少？","opts":["紡織與成衣","電子零件製造","石化與塑膠","半導體晶片"],"ans":3,"tip":"背景知識：高科技半導體通常需要更完整技術與供應鏈，投資項目最少。\n\n判斷方法：產業技術門檻越高、供應鏈要求越完整，投資越少。\n\n作答提醒：先判斷題目考的是位置、氣候、宗教、產業或人口，再把區域背景套回地圖與選項。","skill":"產業技術門檻越高、供應鏈要求越完整，投資越少，選D。","img":"data:image/webp;base64,UklGRjZdAABXRUJQVlA4ICpdAAAwOgGdASoLAlwBPj0ci0QiIaES+b30IAPEtLdqio65/UYStbmgmPXNflb+Aj/kxZPEDkGkLb5x6xSgfP/+u/Hv3deR34r8efOf8i+k/tf5Df2r/7f5L5PP8/xb9ff9r/PepH8k+zH2/+7/5f/W/239t/ul/h/6
